version: '3.8'

networks:
  cassandra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

services:
  cassandra-1:
    image: cassandra:latest
    container_name: cassandra-1
    networks:
      cassandra-net:
        ipv4_address: 172.25.0.2
    environment:
      - CASSANDRA_CLUSTER_NAME=SportFacilityCluster
      - CASSANDRA_SEEDS=cassandra-1,cassandra-2
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 30s
      timeout: 20s
      retries: 10

  cassandra-2:
    image: cassandra:latest
    container_name: cassandra-2
    networks:
      cassandra-net:
        ipv4_address: 172.25.0.3
    environment:
      - CASSANDRA_CLUSTER_NAME=SportFacilityCluster
      - CASSANDRA_SEEDS=cassandra-1,cassandra-2
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    ports:
      - "9043:9042"
    depends_on:
      cassandra-1:
        condition: service_healthy

volumes:
  cassandra_data_1:
  cassandra_data_2: